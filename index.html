<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d90812">
  <title>Quizr | Bonchon NPD Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=beats-1">
  <link rel="stylesheet" href="poster.css?v=beats-1">
  <script defer src="vendor/supabase.js"></script>
  <script defer src="vendor/qrcode.js"></script>
  <script defer src="vendor/xlsx.full.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="audio.js?v=beats-1"></script>
  <script defer src="app.js?v=beats-1"></script>
</head>
<body>
  <div class="locker-wall" aria-hidden="true">
    <i></i><i></i><i></i><i></i><i></i>
  </div>
  <header class="top">
    <a class="brand" href="./" aria-label="Quizr หน้าแรก">Quiz<span>r</span><i>✦</i></a>
    <span id="mode">BONCHON NPD QUIZ</span>
    <div class="top-actions">
      <button id="audio" type="button" class="ghost" aria-pressed="false">เปิดเสียง</button>
      <button id="wide-stage" type="button" class="ghost" aria-pressed="true" hidden>16:9</button>
      <button id="fullscreen" type="button" class="ghost" hidden>เต็มจอ</button>
    </div>
  </header>
  <main id="screen"></main>
  <dialog id="countdown" class="countdown-dialog" aria-labelledby="countdown-title">
    <div class="countdown-head">
      <h2 id="countdown-title">เตรียมตัวก่อนเริ่มเกม</h2>
      <button type="button" id="countdown-cancel" class="ghost">ยกเลิก</button>
    </div>
    <video playsinline preload="none" width="1920" height="1080" aria-label="คลิปนับถอยหลัง 10 วินาที"></video>
    <div class="countdown-actions">
      <button type="button" id="countdown-sound" class="ghost" aria-pressed="false">เปิดเสียงคลิป</button>
      <button type="button" id="countdown-start">ข้ามคลิปและเริ่มเกม</button>
    </div>
  </dialog>
  <div id="message" role="status" aria-live="polite"></div>
</body>
</html>
